services:
  postgres:
    image: postgres:15-alpine
    container_name: barista_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baristapass}
      POSTGRES_DB: ${POSTGRES_DB:-baristadb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barista_backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-barista}:${POSTGRES_PASSWORD:-baristapass}@postgres:5432/${POSTGRES_DB:-baristadb}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: barista_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  pgda
  ta:
